# Build the experimental CI-only executable independently of stock Relay releases.
name: CI-only Relay compiler

on:
  pull_request:
    paths:
      - 'compiler/**'
      - '.github/workflows/relay-compiler-ci.yml'
  push:
    branches: [main-atl, ci/incremental-relay-validation]
    paths:
      - 'compiler/**'
      - '.github/workflows/relay-compiler-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Test and build Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          # Match the stock compiler's toolchain; do not upgrade Relay for this binary.
          toolchain: nightly-2025-08-01
          override: true
          components: rustfmt, clippy
          target: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check formatting
        run: rustfmt --check --edition 2024 crates/relay-bin/src/bin/relay-compiler-ci.rs
      - name: Test CI binary
        run: cargo test --locked -p relay --bin relay-compiler-ci --features vendored
      - name: Lint CI binary
        run: cargo clippy --locked -p relay --bin relay-compiler-ci --features vendored --no-deps -- -D warnings
      - name: Build static executable
        run: cargo build --locked --release -p relay --bin relay-compiler-ci --features vendored --target x86_64-unknown-linux-musl
      - name: Smoke test and record provenance
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/relay-compiler-ci
          "$binary" --help
          mkdir -p dist/relay-compiler-ci
          cp "$binary" dist/relay-compiler-ci/relay-compiler-ci_linux-x64
          cd dist/relay-compiler-ci
          sha256sum relay-compiler-ci_linux-x64 > SHA256SUMS
          {
            printf 'source_revision=%s\n' "$SOURCE_REVISION"
            printf 'target=x86_64-unknown-linux-musl\n'
            printf 'size_bytes=%s\n' "$(wc -c < relay-compiler-ci_linux-x64)"
            rustc --version
            cargo --version
          } > provenance.txt
      # Actions artifacts are review evidence, not the durable distribution URL.
      # Promote a reviewed main-atl build to retained, content-addressed storage
      # before updating AFM's dotslash pin. Never overwrite stock/latest pointers.
      - uses: actions/upload-artifact@v6
        with:
          name: relay-compiler-ci-linux-x64-${{ github.sha }}
          path: compiler/dist/relay-compiler-ci/
          if-no-files-found: error
          retention-days: 30
